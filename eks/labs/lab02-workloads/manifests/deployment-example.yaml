# Deployment de referencia con todas las buenas prácticas
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mi-app
  namespace: produccion
  labels:
    app: mi-app
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mi-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1   # máximo 1 pod no disponible durante update
      maxSurge: 1         # máximo 1 pod extra durante update
  template:
    metadata:
      labels:
        app: mi-app
        version: v1.0.0
    spec:
      serviceAccountName: mi-app-sa  # IRSA

      # Afinidad: distribuir pods en diferentes AZs
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: mi-app

      containers:
      - name: mi-app
        image: mi-repo/mi-app:v1.0.0  # siempre con tag específico, nunca :latest en prod
        ports:
        - name: http
          containerPort: 8080

        env:
        - name: APP_ENV
          value: produccion
        - name: APP_PORT
          value: "8080"

        resources:
          requests:
            cpu: "250m"     # 0.25 vCPU
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        # Startup: da tiempo a la app para arrancar antes de empezar liveness
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          failureThreshold: 30  # 30 × 10s = 5 min máximo para arrancar
          periodSeconds: 10

        # Liveness: si falla → restart
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 0  # startupProbe ya garantizó que arrancó
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5

        # Readiness: si falla → sin tráfico (no restart)
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          periodSeconds: 5
          failureThreshold: 2
          timeoutSeconds: 3

        # Apagado graceful: dar tiempo a que el pod termine requests en curso
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]  # esperar a que ALB retire el pod

      terminationGracePeriodSeconds: 60  # tiempo para apagado graceful

---
# Service ClusterIP
apiVersion: v1
kind: Service
metadata:
  name: mi-app-svc
  namespace: produccion
spec:
  selector:
    app: mi-app
  ports:
  - name: http
    port: 80
    targetPort: http  # referencia por nombre al puerto del contenedor

---
# Ingress con ALB (IngressGroup para compartir el mismo ALB)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mi-app-ingress
  namespace: produccion
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: produccion
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:...
spec:
  rules:
  - host: mi-app.ejemplo.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mi-app-svc
            port:
              number: 80
