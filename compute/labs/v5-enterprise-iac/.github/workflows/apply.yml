################################################################################
# apply.yml — Terraform apply en merge a main
# Prod requiere aprobación manual (environment protection rules)
################################################################################

name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - 'v5-enterprise-iac/terragrunt/**'
      - 'v5-enterprise-iac/atmos/**'

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.7.0"
  TERRAGRUNT_VERSION: "0.55.0"
  AWS_REGION: "eu-west-1"

jobs:
  apply-dev:
    name: Apply — dev
    runs-on: ubuntu-latest
    environment: dev   # GitHub Environment: sin aprobación requerida

    defaults:
      run:
        working-directory: v5-enterprise-iac/terragrunt/dev/eu-west-1

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Install Terragrunt
        run: |
          curl -Lo terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64"
          chmod +x terragrunt && sudo mv terragrunt /usr/local/bin/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActions-dev
          aws-region: ${{ env.AWS_REGION }}

      - name: Terragrunt Apply dev
        run: |
          terragrunt run-all apply \
            --terragrunt-non-interactive \
            --auto-approve

  apply-prod:
    name: Apply — prod
    runs-on: ubuntu-latest
    needs: apply-dev
    environment: prod   # GitHub Environment: requiere aprobación manual

    defaults:
      run:
        working-directory: v5-enterprise-iac/terragrunt/prod/eu-west-1

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Install Terragrunt
        run: |
          curl -Lo terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64"
          chmod +x terragrunt && sudo mv terragrunt /usr/local/bin/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActions-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Terragrunt Apply prod
        run: |
          terragrunt run-all apply \
            --terragrunt-non-interactive \
            --auto-approve

